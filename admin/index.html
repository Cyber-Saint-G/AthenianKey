<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  ADMIN DASHBOARD                                                 ║
  ║  • Σύνδεση με βάση: ../config.js (ίδιο αρχείο με το site)          ║
  ║  • Χρώματα: το :root παρακάτω                                     ║
  ║  • Ρυθμίσεις ασφαλείας: SETTINGS στην αρχή του <script>           ║
  ║  Η πραγματική προστασία γίνεται στη βάση (Row Level Security).    ║
  ╚══════════════════════════════════════════════════════════════════╝

<style>
/* Layout: sidebar σε υπολογιστή, κάτω μπάρα σε κινητό · ίδια παλέτα με το site */
:root {
  --bg: #F3F6FA; --panel: #FFFFFF; --panel-2: #F7F9FC; --ink: #0C1A2E; --muted: #5A6A82;
  --line: rgba(12, 26, 46, .09); --line-strong: rgba(12, 26, 46, .16);
  --accent: #1D4A8C; --accent-ink: #FFFFFF; --accent-soft: rgba(29, 74, 140, .09);
  --s-new: #1D4A8C; --s-new-bg: rgba(29, 74, 140, .1);
  --s-confirmed: #8A5A00; --s-confirmed-bg: rgba(214, 150, 20, .16);
  --s-completed: #17694A; --s-completed-bg: rgba(30, 140, 95, .13);
  --s-cancelled: #9A2B33; --s-cancelled-bg: rgba(180, 35, 47, .1);
  --chart-2: #6FA3E8; --danger: #B4232F; --ok: #17694A;
  --shadow: 0 .8rem 2.4rem -1rem rgba(18, 40, 78, .22);
  --glass: rgba(255, 255, 255, .72); --scrim: rgba(12, 26, 46, .28);
  --font-brand: "Marcellus", "GFS Didot", Georgia, serif;
  --font-ui: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070E19; --panel: #0E1828; --panel-2: #122036; --ink: #E8EEF7; --muted: #8B9AB1;
    --line: rgba(232, 238, 247, .09); --line-strong: rgba(232, 238, 247, .18);
    --accent: #8FB5EE; --accent-ink: #07101D; --accent-soft: rgba(143, 181, 238, .12);
    --s-new: #9DBEF2; --s-new-bg: rgba(143, 181, 238, .14);
    --s-confirmed: #F0C46A; --s-confirmed-bg: rgba(240, 196, 106, .14);
    --s-completed: #74D3A8; --s-completed-bg: rgba(116, 211, 168, .13);
    --s-cancelled: #F08A93; --s-cancelled-bg: rgba(240, 138, 147, .13);
    --chart-2: #3D6CB0; --danger: #F08A93; --ok: #74D3A8;
    --shadow: 0 .8rem 2.4rem -1rem rgba(0, 0, 0, .6);
    --glass: rgba(14, 24, 40, .78); --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070E19; --panel: #0E1828; --panel-2: #122036; --ink: #E8EEF7; --muted: #8B9AB1;
  --line: rgba(232, 238, 247, .09); --line-strong: rgba(232, 238, 247, .18);
  --accent: #8FB5EE; --accent-ink: #07101D; --accent-soft: rgba(143, 181, 238, .12);
  --s-new: #9DBEF2; --s-new-bg: rgba(143, 181, 238, .14);
  --s-confirmed: #F0C46A; --s-confirmed-bg: rgba(240, 196, 106, .14);
  --s-completed: #74D3A8; --s-completed-bg: rgba(116, 211, 168, .13);
  --s-cancelled: #F08A93; --s-cancelled-bg: rgba(240, 138, 147, .13);
  --chart-2: #3D6CB0; --danger: #F08A93; --ok: #74D3A8;
  --shadow: 0 .8rem 2.4rem -1rem rgba(0, 0, 0, .6);
  --glass: rgba(14, 24, 40, .78); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }

/* ── Login ─────────────────────────────────────────────── */
.login { min-height: 100vh; display: grid; place-items: center;
  padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 24rem; background: var(--panel); border: 1px solid var(--line); border-radius: 1.6rem; padding: 2rem 1.6rem; box-shadow: var(--shadow); }
.brand { font-family: var(--font-brand); font-size: 1.5rem; display: flex; align-items: center; gap: .5rem; }
.brand svg { width: 1.1rem; height: 1.1rem; color: var(--accent); }
.brand small { font-family: var(--font-ui); font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: .3rem; }
.login h1 { font-size: 1.15rem; margin: 1.6rem 0 .3rem; }
.login form { display: grid; gap: .9rem; margin-top: 1.2rem; }

/* ── Form controls ─────────────────────────────────────── */
.field { display: grid; gap: .35rem; min-width: 0; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.input { width: 100%; min-height: 2.75rem; padding: .55rem .8rem; border-radius: .8rem; background: var(--panel); border: 1px solid var(--line-strong); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 5.5rem; resize: vertical; line-height: 1.5; }
.btn { min-height: 2.6rem; padding: 0 1rem; border-radius: .8rem; border: 1px solid var(--line-strong); background: var(--panel); font-weight: 700; font-size: .88rem;
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; transition: transform .15s, background .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn svg { width: 1.05rem; height: 1.05rem; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { min-height: 2.1rem; padding: 0 .7rem; font-size: .8rem; border-radius: .65rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: .85rem; padding: .65rem .8rem; border-radius: .7rem; }
.msg.err { color: var(--danger); background: var(--s-cancelled-bg); }
.msg.ok { color: var(--ok); background: var(--s-completed-bg); }
.msg.info { color: var(--muted); background: var(--panel-2); }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { min-height: 2.1rem; padding: 0 .8rem; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); font-size: .8rem; font-weight: 700; display: inline-flex; align-items: center; gap: .4rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip .count { opacity: .7; font-variant-numeric: tabular-nums; }

/* ── Shell ─────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--panel) 15rem, transparent 15rem); }
.side { position: sticky; top: 0; height: 100vh; padding: 1.4rem 1rem; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 1.6rem; }
.nav { display: grid; gap: .2rem; }
.nav a { display: flex; align-items: center; gap: .7rem; padding: .65rem .8rem; border-radius: .8rem; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .9rem; }
.nav a svg { width: 1.2rem; height: 1.2rem; flex: none; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .badge { margin-left: auto; min-width: 1.4rem; height: 1.4rem; padding: 0 .35rem; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--muted); display: grid; gap: .5rem; }
.side-foot b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.main { min-width: 0; padding-block: 1.6rem 3rem; padding-left: max(16px, 2rem, env(safe-area-inset-left, 0px)); padding-right: max(16px, 2rem, env(safe-area-inset-right, 0px)); }
.topbar { display: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
.page-head h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
.page-head p { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; }
.demo-bar { background: var(--s-confirmed-bg); color: var(--s-confirmed); font-size: .8rem; font-weight: 700; padding: .5rem .9rem; border-radius: .8rem; margin-bottom: 1rem; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 1.1rem; }
.card-pad { padding: 1.1rem 1.2rem; }
.card h2 { font-size: .95rem; margin: 0 0 .8rem; }
.toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: .9rem; }
.toolbar .search { flex: 1 1 14rem; }
.toolbar .input { min-height: 2.4rem; }
.toolbar .dates { display: flex; gap: .4rem; align-items: center; }
.toolbar .dates .input { width: 9.5rem; }

/* Status pill */
.pill { display: inline-flex; align-items: center; height: 1.55rem; padding: 0 .6rem; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
.pill.new { color: var(--s-new); background: var(--s-new-bg); }
.pill.confirmed { color: var(--s-confirmed); background: var(--s-confirmed-bg); }
.pill.completed { color: var(--s-completed); background: var(--s-completed-bg); }
.pill.cancelled { color: var(--s-cancelled); background: var(--s-cancelled-bg); }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: .7rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: .25rem; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); }
td { padding: .75rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; transition: background .15s; }
tbody tr:hover { background: var(--panel-2); }
tr.unseen td { font-weight: 700; }
td .sub { display: block; color: var(--muted); font-size: .78rem; font-weight: 500; overflow-wrap: anywhere; }
.empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }

/* Request list (cards on mobile) */
.rq-list { display: none; }
.rq { display: grid; gap: .35rem; padding: .9rem 1rem; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.rq-top { display: flex; align-items: center; gap: .5rem; justify-content: space-between; }
.rq-top b { display: flex; align-items: center; gap: .45rem; font-size: .95rem; }
.rq .sub { color: var(--muted); font-size: .8rem; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .7rem; margin-bottom: .9rem; }
.kpi { padding: .9rem 1rem; }
.kpi small { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi b { display: block; font-size: 1.5rem; font-weight: 700; margin-top: .2rem; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .delta { font-size: .75rem; font-weight: 700; color: var(--muted); }
.kpi .delta.up { color: var(--ok); } .kpi .delta.down { color: var(--danger); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; margin-bottom: .9rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; margin-bottom: .9rem; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-ui); }
.chart .grid { stroke: var(--line); }
.legend { display: flex; gap: 1rem; font-size: .75rem; color: var(--muted); margin-bottom: .5rem; }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: .2rem; margin-right: .35rem; vertical-align: -1px; }
.bars { display: grid; gap: .55rem; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .6rem; font-size: .84rem; }
.bar-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row b { font-variant-numeric: tabular-nums; font-weight: 700; }
.bar-row .track { grid-column: 1 / -1; height: .4rem; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(34rem, 100%); background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .35s cubic-bezier(.2,.9,.25,1); display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open { transform: none; }
.drawer.wide { width: min(64rem, 100%); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 1rem max(1.2rem, env(safe-area-inset-right, 0px)) 1rem 1.2rem; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.drawer-body { overflow-y: auto; padding: 1.1rem max(1.2rem, env(safe-area-inset-right, 0px)) 1.5rem 1.2rem; display: grid; gap: 1.1rem; align-content: start; flex: 1; }
.drawer-foot { padding: .9rem max(1.2rem, env(safe-area-inset-right, 0px)) .9rem 1.2rem; border-top: 1px solid var(--line); display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; }
.dl { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .55rem 1rem; font-size: .88rem; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.section-t { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .35rem; }
.seg button { min-height: 2.5rem; border-radius: .7rem; border: 1px solid var(--line-strong); background: var(--panel); font-weight: 700; font-size: .8rem; }
.seg button[aria-pressed="true"].new { background: var(--s-new-bg); color: var(--s-new); border-color: currentColor; }
.seg button[aria-pressed="true"].confirmed { background: var(--s-confirmed-bg); color: var(--s-confirmed); border-color: currentColor; }
.seg button[aria-pressed="true"].completed { background: var(--s-completed-bg); color: var(--s-completed); border-color: currentColor; }
.seg button[aria-pressed="true"].cancelled { background: var(--s-cancelled-bg); color: var(--s-cancelled); border-color: currentColor; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; font-size: .82rem; }
.timeline li { display: flex; gap: .6rem; align-items: center; }
.copy { border: 0; background: none; color: var(--accent); padding: 0 .3rem; font-size: .78rem; font-weight: 700; }

/* CMS */
.tabs { display: flex; gap: .3rem; overflow-x: auto; padding-bottom: .2rem; margin-bottom: 1rem; scrollbar-width: none; }
.tabs button { flex: none; min-height: 2.3rem; padding: 0 .9rem; border-radius: .7rem; border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: .86rem; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.fields { display: grid; gap: .9rem; }
.fieldgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.fieldgrid .full { grid-column: 1 / -1; }
.block { padding: 1rem 1.1rem; display: grid; gap: .9rem; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
.block-head h3 { margin: 0; font-size: .98rem; }
.slot { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .8rem; align-items: center; }
.thumb { width: 5.5rem; aspect-ratio: 3/4; border-radius: .7rem; background: var(--panel-2) center / cover no-repeat; border: 1px solid var(--line); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .7rem; }
.lib-item { border: 1px solid var(--line); border-radius: .9rem; overflow: hidden; background: var(--panel); display: grid; text-align: left; padding: 0; }
.lib-item .thumb { width: 100%; aspect-ratio: 4/3; border: 0; border-radius: 0; }
.lib-item .meta { padding: .5rem .6rem .6rem; font-size: .72rem; color: var(--muted); display: grid; gap: .3rem; }
.lib-item .meta b { color: var(--ink); font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-item.pick { cursor: pointer; } .lib-item.pick:hover { border-color: var(--accent); }
.savebar { position: sticky; bottom: 1rem; z-index: 5; margin-top: 1.2rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; justify-content: space-between;
  padding: .75rem .9rem; border-radius: 1rem; background: var(--glass); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.savebar .acts { display: flex; gap: .5rem; flex-wrap: wrap; }
.preview-frame { width: min(26rem, 100%); height: min(52rem, calc(100vh - 12rem)); margin: 0 auto; display: block; border: 1px solid var(--line-strong); border-radius: 1.6rem; background: var(--bg); }
.mini-btns { display: flex; gap: .3rem; }
.ver { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ver b { font-size: .9rem; } .ver .sub { color: var(--muted); font-size: .78rem; display: block; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 999px; font-size: .84rem; font-weight: 700; transition: all .3s; max-width: calc(100% - 2rem); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Mobile ────────────────────────────────────────────── */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .side { display: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: .7rem max(16px, env(safe-area-inset-right, 0px)) .7rem max(16px, env(safe-area-inset-left, 0px)); background: var(--glass); border-bottom: 1px solid var(--line);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
  .main { padding-block: 1.1rem 7rem; }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
    padding: .4rem max(.5rem, env(safe-area-inset-right, 0px)) calc(.4rem + env(safe-area-inset-bottom, 0px)) max(.5rem, env(safe-area-inset-left, 0px));
    background: var(--glass); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .bottom-nav a { display: grid; justify-items: center; gap: .15rem; padding: .35rem 0; color: var(--muted); text-decoration: none; font-size: .66rem; font-weight: 700; position: relative; }
  .bottom-nav a svg { width: 1.3rem; height: 1.3rem; }
  .bottom-nav a[aria-current="page"] { color: var(--accent); }
  .bottom-nav .badge { position: absolute; top: .1rem; left: calc(50% + .35rem); min-width: 1.1rem; height: 1.1rem; padding: 0 .25rem; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .6rem; display: grid; place-items: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-3, .fieldgrid { grid-template-columns: minmax(0, 1fr); }
  .rq-table { display: none; }

/* ══════════════════════════════════════════════════════════════════
   ΠΡΟΣΒΑΣΗ ΣΤΑ ΔΕΔΟΜΕΝΑ
   Δύο υλοποιήσεις με το ίδιο interface: Supabase (πραγματική) και

const BK = window.AK_BACKEND || {};
const configured = !!(BK.supabaseUrl && BK.supabaseAnonKey && window.supabase);

function supabaseApi() {
  const sb = window.supabase.createClient(BK.supabaseUrl, BK.supabaseAnonKey, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const BUCKET = "site-images";
  return {
    demo: false,
    async session() { return (await sb.auth.getSession()).data.session; },
    async loginStatus(email) { return ok(await sb.rpc("admin_login_status", { p_email: email })) || 0; },
    async logLogin(email, success) { try { await sb.rpc("admin_log_login", { p_email: email, p_success: success }); } catch {} },
    async signIn(email, password) { return ok(await sb.auth.signInWithPassword({ email, password })); },
    async isAdmin() { return !!ok(await sb.rpc("is_admin")); },
    async signOut() { try { await sb.auth.signOut(); } catch {} },
    async changePassword(password) { return ok(await sb.auth.updateUser({ password })); },
    async requests() {
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const page = ok(await sb.from("requests").select("*").order("created_at", { ascending: false }).range(from, from + 999));
        rows.push(...page); if (page.length < 1000) break;
      }
      return rows;
    },
    async updateRequest(id, patch) { return ok(await sb.from("requests").update(patch).eq("id", id).select().single()); },
    async requestEvents(id) { return ok(await sb.from("request_events").select("*").eq("request_id", id).order("at")); },
    async customers() { return ok(await sb.rpc("admin_customers")); },
    async traffic(from, to) { return ok(await sb.rpc("admin_traffic_stats", { p_from: from, p_to: to })); },
    async business(from, to) { return ok(await sb.rpc("admin_business_stats", { p_from: from, p_to: to })); },
    async content() { return ok(await sb.from("site_content").select("data, version_id, updated_at").eq("id", 1).maybeSingle()); },
    async versions() { return ok(await sb.from("content_versions").select("id, note, created_at").order("id", { ascending: false }).limit(200)); },
    async version(id) { return ok(await sb.from("content_versions").select("data").eq("id", id).single()).data; },
    async publish(data, note) { return ok(await sb.rpc("publish_content", { p_data: data, p_note: note || null })); },
    async images() {
      const list = ok(await sb.storage.from(BUCKET).list("uploads", { limit: 1000, sortBy: { column: "created_at", order: "desc" } }));
      return list.filter(f => f.id).map(f => ({ name: "uploads/" + f.name, url: sb.storage.from(BUCKET).getPublicUrl("uploads/" + f.name).data.publicUrl,
        size: f.metadata?.size, created: f.created_at }));
    },
    async upload(blob, name) {
      ok(await sb.storage.from(BUCKET).upload(name, blob, { contentType: blob.type, upsert: false, cacheControl: "31536000" }));
      return sb.storage.from(BUCKET).getPublicUrl(name).data.publicUrl;
    },
    async removeImage(name) { ok(await sb.storage.from(BUCKET).remove([name])); },
  };
}

function demoApi() {
  // Ντετερμινιστικά τυχαία δείγματα (ίδια σε κάθε άνοιγμα)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const names = ["Anna Schmidt", "James Carter", "Μαρία Παπαδοπούλου", "Sophie Martin", "Luca Rossi", "Γιώργος Αντωνίου", "Emily Clark", "Hans Müller",
    "Olivia Brown", "Νίκος Κωνσταντίνου", "Chloé Dubois", "Daniel Levi", "Ελένη Γεωργίου", "Mark Wilson", "Isabella García", "Oliver Smith", "Κατερίνα Δημητρίου",
    "Noah Johnson", "Lena Fischer", "Αλέξανδρος Νικολάου", "Ava Taylor", "Pierre Laurent"];
  const services = ["transfers", "yachts", "dining", "villas", "experiences", "chef", "events"];
  const regions = ["athens", "zakynthos", "crete"];
  const now = Date.now(), DAY = 864e5;
  const customers = names.map((n, i) => ({
    id: "c" + i, full_name: n, phone: "+30 69" + String(10000000 + Math.floor(rnd() * 89999999)),
    email: i % 4 === 3 ? null : n.toLowerCase().normalize("NFD").replace(/[^a-z ]/g, "").trim().replace(/\s+/g, ".") + "@example.com",
    first_seen_at: null, last_request_at: null, request_count: 0,
  }));
  const requests = [];
  for (let i = 0; i < 46; i++) {
    const c = i < customers.length ? customers[i] : pick(customers);
    const created = new Date(now - Math.floor(rnd() * 44 * DAY) - Math.floor(rnd() * DAY));
    const st = created > now - 2 * DAY ? "new" : pick(["new", "confirmed", "confirmed", "completed", "completed", "cancelled"]);
    const sv = [pick(services)]; if (rnd() > .6) sv.push(pick(services));
    requests.push({
      id: "r" + i, ref: "AK-" + (100000 + i * 7919).toString(36).toUpperCase().padStart(6, "X") + "DEMO".slice(0, 2), created_at: created.toISOString(), customer_id: c.id,
      services: [...new Set(sv)], region: pick(regions), travel_date: isoDay(new Date(created.getTime() + (10 + rnd() * 90) * DAY)),
      guests: 1 + Math.floor(rnd() * 7), full_name: c.full_name, phone: c.phone, email: c.email,
      notes: pick(["", "Arriving on flight A3 602 at 14:20.", "Anniversary dinner, table with a view please.", "Δύο παιδιά 5 και 8 ετών.", "Prefer a crewed motor yacht.", ""]),
      lang: pick(["en", "en", "el"]), channel: pick(["whatsapp", "whatsapp", "email"]), status: st,
      amount: st === "confirmed" || st === "completed" ? Math.round(300 + rnd() * 4200) : null, admin_notes: null,
      seen_at: st === "new" && rnd() > .4 ? null : created.toISOString(), status_changed_at: null, updated_at: created.toISOString(),
    });
  }
  requests.sort((a, b) => b.created_at.localeCompare(a.created_at));
  const events = [];
  const traffic = {}; // ανά ημέρα
  for (let d = 0; d < 400; d++) {
    const day = isoDay(new Date(now - d * DAY)); const base = 40 + 25 * Math.sin(d / 5) + rnd() * 30;
    const visitors = Math.round(base); const visits = Math.round(visitors * 1.15); const pageviews = Math.round(visits * (2.4 + rnd()));
    traffic[day] = { visitors, visits, pageviews };
  }
  let content = null, versions = [], vid = 0; const images = [];
  const wait = (v) => new Promise(r => setTimeout(() => r(clone(v)), 120));
  const inRange = (iso, f, t) => { const d = isoDay(iso); return d >= f && d <= t; };
  const days = (f, t) => { const out = []; for (let d = f; d <= t; d = addDays(d, 1)) out.push(d); return out; };
  function recalcCustomers() {
    customers.forEach(c => {
      const rs = requests.filter(r => r.customer_id === c.id);
      c.request_count = rs.length;
      c.first_seen_at = rs.length ? rs[rs.length - 1].created_at : null;
      c.last_request_at = rs.length ? rs[0].created_at : null;
    });
  }
  recalcCustomers();
  return {
    demo: true,
    async session() { return null; },
    async loginStatus() { return 0; }, async logLogin() {}, async signIn() {}, async isAdmin() { return true; }, async signOut() {},
    async changePassword() { throw new Error("Στη δοκιμαστική προβολή δεν αλλάζει κωδικός."); },
    async requests() { return wait(requests); },
    async updateRequest(id, patch) {
      const r = requests.find(x => x.id === id);
      if (patch.status && patch.status !== r.status) { events.push({ request_id: id, at: new Date().toISOString(), from_status: r.status, to_status: patch.status }); r.status_changed_at = new Date().toISOString(); }
      Object.assign(r, patch, { updated_at: new Date().toISOString() }); return wait(r);
    },
    async requestEvents(id) { return wait(events.filter(e => e.request_id === id)); },
    async customers() {
      return wait(customers.filter(c => c.request_count).map(c => {
        const l = requests.find(r => r.customer_id === c.id) || {};
        return { ...c, last_ref: l.ref, last_region: l.region, last_services: l.services, last_travel_date: l.travel_date, last_guests: l.guests, last_status: l.status, last_notes: l.notes, last_amount: l.amount };
      }).sort((a, b) => (b.last_request_at || "").localeCompare(a.last_request_at || "")));
    },
    async traffic(f, t) {
      const ds = days(f, t); const daily = ds.map(d => ({ d, ...(traffic[d] || { visitors: 0, visits: 0, pageviews: 0 }) }));
      const sum = (k) => daily.reduce((a, x) => a + x[k], 0); const pv = sum("pageviews"), vs = sum("visits");
      const share = (pairs, total) => pairs.map(([k, p]) => ({ k, n: Math.round(total * p) }));
      return wait({ pageviews: pv, visits: vs, visitors: sum("visitors"), daily,
        pages: share([["/#home", .34], ["/#services", .17], ["/#zakynthos", .12], ["/#request", .1], ["/#athens", .09], ["/#crete", .08], ["/#contact", .06]], pv),
        sources: share([["direct", .38], ["Google", .31], ["Instagram", .16], ["Facebook", .08], ["WhatsApp", .05]], vs),
        devices: share([["mobile", .71], ["desktop", .23], ["tablet", .06]], sum("visitors")) });
    },
    async business(f, t) {
      const q = requests.filter(r => inRange(r.created_at, f, t)); const paid = (r) => ["confirmed", "completed"].includes(r.status);
      const newC = customers.filter(c => c.first_seen_at && inRange(c.first_seen_at, f, t));
      const count = (arr) => Object.entries(arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {})).map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n);
      return wait({ requests: q.length, revenue: q.filter(paid).reduce((a, r) => a + (r.amount || 0), 0), new_customers: newC.length,
        daily: days(f, t).map(d => ({ d, requests: q.filter(r => isoDay(r.created_at) === d).length,
          revenue: q.filter(r => paid(r) && isoDay(r.created_at) === d).reduce((a, r) => a + (r.amount || 0), 0),
          new_customers: newC.filter(c => isoDay(c.first_seen_at) === d).length })),
        by_status: count(q.map(r => r.status)), by_service: count(q.flatMap(r => r.services)), by_region: count(q.map(r => r.region || "-")) });
    },
    async content() { return wait(content); },
    async versions() { return wait(versions.slice().reverse().map(({ id, note, created_at }) => ({ id, note, created_at }))); },
    async version(id) { return wait(versions.find(v => v.id === id).data); },
    async publish(data, note) { vid++; versions.push({ id: vid, data: clone(data), note, created_at: new Date().toISOString() });
      content = { data: clone(data), version_id: vid, updated_at: new Date().toISOString() }; return wait(vid); },
    async images() { return wait(images); },
    async upload(blob, name) { const url = URL.createObjectURL(blob); images.unshift({ name, url, size: blob.size, created: new Date().toISOString() }); return url; },
    async removeImage(name) { const i = images.findIndex(x => x.name === name); if (i >= 0) images.splice(i, 1); },
  };
}

/* ══════════════════════════════════════════════════════════════════
   ΣΥΝΔΕΣΗ, ΑΔΡΑΝΕΙΑ, ΠΛΟΗΓΗΣΗ

let API = null, ME = "";
const cache = { requests: null, customers: null };

async function boot() {
  $("#demoBtn").hidden = configured;
  if (!configured) {
    $("#loginInfo").hidden = false;
    $("#loginInfo").textContent = "Η σύνδεση με τη βάση δεν έχει ρυθμιστεί ακόμη (config.js). Μπορείτε να δείτε το dashboard με δείγμα δεδομένων.";
    $("#loginBtn").disabled = true;
    return;
  }
  API = supabaseApi();
  const s = await API.session().catch(() => null);
  if (s && await API.isAdmin().catch(() => false)) { ME = s.user.email; enterApp(); }
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!API) return;
  const email = $("#loginEmail").value.trim(), pass = $("#loginPass").value;
  const err = $("#loginErr"); err.hidden = true;
  if (!email || !pass) { err.textContent = "Συμπληρώστε email και κωδικό."; err.hidden = false; return; }
  const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Σύνδεση…";
  try {
    const locked = await API.loginStatus(email);
    if (locked > 0) throw new Error(`Πολλές αποτυχημένες προσπάθειες. Δοκιμάστε ξανά σε ${Math.ceil(locked / 60)} λεπτά.`);
    try { await API.signIn(email, pass); }
    catch (x) { await API.logLogin(email, false); throw new Error(/rate|too many/i.test(x.message) ? "Πολλές προσπάθειες. Δοκιμάστε ξανά αργότερα." : "Λάθος email ή κωδικός."); }
    if (!await API.isAdmin()) { await API.logLogin(email, false); await API.signOut(); throw new Error("Αυτός ο λογαριασμός δεν έχει πρόσβαση διαχειριστή."); }
    await API.logLogin(email, true);
    ME = email; $("#loginPass").value = ""; enterApp();
  } catch (x) { err.textContent = x.message || "Η σύνδεση απέτυχε."; err.hidden = false; }
  finally { btn.disabled = !API; btn.textContent = "Σύνδεση"; }
});

let SITE_DEFAULTS = null, SITE_URL = null;
function loadSiteDefaults() {
  return new Promise((resolve) => {
    if (SITE_DEFAULTS) return resolve(SITE_DEFAULTS);
    let i = 0;
    const tryNext = () => {
      if (i >= SETTINGS.siteCandidates.length) return resolve(null);
      const url = SETTINGS.siteCandidates[i++];
      const f = document.createElement("iframe"); f.hidden = true; f.src = url + "?preview";
      const done = (ok) => { f.remove(); if (ok) { SITE_URL = url; resolve(SITE_DEFAULTS); } else tryNext(); };
      const t = setTimeout(() => done(false), 6000);
      f.onload = () => { clearTimeout(t); try { const d = f.contentWindow.AK_DEFAULT_CONFIG; if (d) { SITE_DEFAULTS = clone(d); return done(true); } } catch {} done(false); };
      document.body.appendChild(f);
    };
    tryNext();
  });
}

const ST = { period: "30", from: "", to: "" };
function periodRange() {
  const today = isoDay(new Date());
  if (ST.period === "today") return [today, today];
  if (ST.period === "7") return [addDays(today, -6), today];
  if (ST.period === "30") return [addDays(today, -29), today];
  if (ST.period === "custom" && ST.from && ST.to && ST.from <= ST.to) return [ST.from, ST.to];
  return [addDays(today, -29), today];
}

        `<button class="chip" type="button" data-period="${k}" aria-pressed="${ST.period === k}">${l}</button>`).join("")}</div>
      <div class="dates" id="stDates" ${ST.period === "custom" ? "" : "hidden"}><input class="input" id="stFrom" type="date" value="${ST.from}" aria-label="Από"><span class="muted">έως</span><input class="input" id="stTo" type="date" value="${ST.to}" aria-label="Έως"></div>
    </div>
    <div id="stBody">${loading()}</div>`;
  $("#stChips").addEventListener("click", e => {
    const b = e.target.closest("[data-period]"); if (!b) return;
    ST.period = b.dataset.period;
    if (ST.period === "custom" && !ST.from) { const [f, t] = [addDays(isoDay(new Date()), -89), isoDay(new Date())]; ST.from = f; ST.to = t; }
    viewStats();
  });
  $("#stFrom").addEventListener("change", e => { ST.from = e.target.value; drawStats(); });
  $("#stTo").addEventListener("change", e => { ST.to = e.target.value; drawStats(); });
  drawStats();
}

    const days = tr.daily.map(x => x.d);

      <div class="kpis">

        ${kpi("Μοναδικοί επισκέπτες", tr.visitors, ptr.visitors, fmtNum, "Μετρώνται ανά ημέρα χωρίς cookies. Σε πολυήμερη περίοδο είναι το άθροισμα των ημερών.")}
        ${kpi("Προβολές σελίδων", tr.pageviews, ptr.pageviews)}
        ${kpi("Αιτήματα", bz.requests, pbz.requests)}
        ${kpi("Έσοδα", bz.revenue, pbz.revenue, fmtMoney, "Άθροισμα ποσών σε Επιβεβαιωμένα και Ολοκληρωμένα αιτήματα.")}
        ${kpi("Νέοι πελάτες", bz.new_customers, pbz.new_customers)}
      </div>
      <div class="card card-pad chart" style="margin-bottom:.9rem"><h2>Επισκεψιμότητα ανά ημέρα</h2>
        <div class="legend"><span><i style="background:var(--accent)"></i>Προβολές σελίδων</span><span><i style="background:var(--chart-2)"></i>Μοναδικοί επισκέπτες</span></div>
        ${lineChart(days, [{ v: tr.daily.map(x => x.pageviews), c: "var(--accent)" }, { v: tr.daily.map(x => x.visitors), c: "var(--chart-2)" }])}</div>
      <div class="grid-3">

      </div>
      <div class="grid-3">
        <div class="card card-pad"><h2>Δημοφιλέστερες σελίδες</h2>${bars(tr.pages, k => PATH_LABEL[k] || regLabel(k.replace("/#", "")) || k)}</div>
        <div class="card card-pad"><h2>Πηγές επισκεψιμότητας</h2>${bars(tr.sources, k => k === "direct" ? "Απευθείας / άγνωστη" : k)}</div>
        <div class="card card-pad"><h2>Συσκευές</h2>${bars(tr.devices, k => ({ mobile: "Κινητό", desktop: "Υπολογιστής", tablet: "Tablet" }[k] || "Άλλο"))}</div>

function bars(items, label) {

  const max = Math.max(...items.map(x => x.n), 1), tot = items.reduce((a, x) => a + x.n, 0);
  return `<div class="bars">${items.slice(0, 8).map(x => `<div class="bar-row"><span>${esc(label(x.k))}</span><b>${fmtNum(x.n)} <span class="muted small">${Math.round(x.n / tot * 100)}%</span></b>
    <div class="track"><i style="width:${(x.n / max * 100).toFixed(1)}%"></i></div></div>`).join("")}</div>`;
}
const niceMax = (m) => { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(v => v >= m); };

  const x = (i) => P.l + (days.length > 1 ? i / (days.length - 1) : .5) * (W - P.l - P.r);
  return ticks.map(v => { const y = H - P.b - v / max * (H - P.t - P.b);
      return `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="ax" x="${P.l - 6}" y="${y + 3}" text-anchor="end">${esc(fmt(v))}</text>`; }).join("") +
    xs.map(i => `<text class="ax" x="${x(i)}" y="${H - 4}" text-anchor="${days.length > 1 ? (i === 0 ? "start" : i === days.length - 1 ? "end" : "middle") : "middle"}">${shortDay(days[i])}</text>`).join("");
}
function lineChart(days, series) {
  const W = 760, H = 220, P = { l: 44, r: 8, t: 10, b: 22 };
  const max = niceMax(Math.max(...series.flatMap(s => s.v), 0));
  const x = (i) => P.l + (days.length > 1 ? i / (days.length - 1) : .5) * (W - P.l - P.r);
  const y = (v) => H - P.b - v / max * (H - P.t - P.b);
  const path = (v) => v.map((n, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(n).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Γράφημα επισκεψιμότητας">${axes(days, max, fmtNum, W, H, P)}
    ${series.map((s, k) => `${k === 0 ? `<path d="${path(s.v)}L${x(s.v.length - 1)},${H - P.b}L${x(0)},${H - P.b}Z" fill="${s.c}" opacity=".08"/>` : ""}
      <path d="${path(s.v)}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${s.v.map((n, i) => `<circle cx="${x(i)}" cy="${y(n)}" r="${i === s.v.length - 1 || s.v.length < 2 ? 3.5 : 0}" fill="${s.c}"><title>${shortDay(days[i])}: ${fmtNum(n)}</title></circle>`).join("")}`).join("")}
    ${days.map((d, i) => `<rect x="${x(i) - (W - P.l - P.r) / Math.max(days.length, 1) / 2}" y="${P.t}" width="${(W - P.l - P.r) / Math.max(days.length, 1)}" height="${H - P.t - P.b}" fill="transparent"><title>${shortDay(d)}: ${series.map(s => fmtNum(s.v[i])).join(" / ")}</title></rect>`).join("")}</svg>`;
}
function barChart(days, values, fmt) {
  const W = 380, H = 170, P = { l: 52, r: 6, t: 8, b: 20 };
  const max = niceMax(Math.max(...values, 0));

  return `<svg viewBox="0 0 ${W} ${H}" role="img">${axes(days, max, short, W, H, { ...P, l: P.l + step / 2, r: P.r + step / 2 })}

      return `<rect x="${P.l + i * step + (step - bw) / 2}" y="${H - P.b - h}" width="${bw}" height="${Math.max(h, v ? 1 : 0)}" rx="${Math.min(3, bw / 2)}" fill="var(--accent)"><title>${shortDay(days[i])}: ${esc(fmt(v))}</title></rect>`; }).join("")}</svg>`;
}

  $("#cmTab").innerHTML = `<div class="card block">
      <div class="block-head"><h3>Βιβλιοθήκη φωτογραφιών</h3><label class="btn btn-primary btn-sm">Ανέβασμα<input type="file" id="upInput" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div>
      <p class="muted small" style="margin:0">JPEG, PNG ή WebP έως ${SETTINGS.maxUploadMB} MB. Μικραίνουν αυτόματα σε ${SETTINGS.imageMaxPx}px και μετατρέπονται σε WebP. Για να μπει μια φωτογραφία στο site, ανοίξτε την καρτέλα «Προορισμοί» και πατήστε «Αλλαγή φωτογραφίας».</p>
      <div id="upMsg"></div><div class="lib" id="libGrid">${loading()}</div></div>`;
  $("#upInput").addEventListener("change", (e) => uploadFiles(e.target.files, () => tabImages()));
  try { LIB = await API.images(); } catch (x) { $("#libGrid").innerHTML = failed(x); return; }
  const builtIn = [...new Set(DRAFT.regions.flatMap(r => [r.image, ...(r.experiences || []).map(x => x.image)]).filter(s => s && !/^(https:|blob:)/.test(s)))];
  $("#libGrid").innerHTML = LIB.map(f => {
    const used = usages(f.url);
    return `<div class="lib-item"><div class="thumb" style="background-image:url('${esc(f.url)}')"></div><div class="meta"><b>${esc(f.name.split("/").pop())}</b>
      <span class="num">${f.size ? (f.size / 1024).toFixed(0) + " KB · " : ""}${fmtDate(f.created)}</span>
      <span>${used.length ? "Σε χρήση: " + esc(used.join(", ")) : "Δεν χρησιμοποιείται"}</span>
      <span class="mini-btns"><button class="btn btn-sm btn-danger" type="button" data-del-image="${esc(f.name)}" ${used.length ? "disabled title=\"Αλλάξτε πρώτα τη φωτογραφία όπου χρησιμοποιείται\"" : ""}>Διαγραφή</button></span></div></div>`;
  }).join("") + builtIn.map(src => `<div class="lib-item"><div class="thumb" style="background-image:url('${esc(previewSrc(src))}')"></div><div class="meta"><b>${esc(src.split("/").pop())}</b><span>Αρχική φωτογραφία του site</span>
      <span>${usages(src).length ? "Σε χρήση: " + esc(usages(src).join(", ")) : "Δεν χρησιμοποιείται"}</span></div></div>`).join("") || `<div class="empty">Καμία φωτογραφία.</div>`;
}
async function optimizeImage(file) {
  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) throw new Error(`«${file.name}»: επιτρέπονται μόνο JPEG, PNG, WebP.`);
  if (file.size > SETTINGS.maxUploadMB * 1048576) throw new Error(`«${file.name}»: μεγαλύτερο από ${SETTINGS.maxUploadMB} MB.`);
  const bmp = await createImageBitmap(file).catch(() => { throw new Error(`«${file.name}»: δεν είναι έγκυρη εικόνα.`); });
  const k = Math.min(1, SETTINGS.imageMaxPx / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, "image/webp", SETTINGS.imageQuality));
  if (!blob || blob.type !== "image/webp") blob = await new Promise(r => c.toBlob(r, "image/jpeg", SETTINGS.imageQuality));
  if (blob.size > 5 * 1048576) throw new Error(`«${file.name}»: παραμένει μεγαλύτερο από 5 MB μετά τη συμπίεση.`);
  return blob;
}
async function uploadFiles(files, after) {
  const box = $("#upMsg") || $("#pickMsg"); const done = [];
  for (const f of files) {
    try {
      if (box) box.innerHTML = `<div class="msg info">Βελτιστοποίηση και ανέβασμα «${esc(f.name)}»…</div>`;
      const blob = await optimizeImage(f);
      const slug = f.name.replace(/\.[^.]+$/, "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "photo";
      const url = await API.upload(blob, `uploads/${Date.now()}-${slug}.${blob.type === "image/webp" ? "webp" : "jpg"}`);
      done.push(url);
      if (box) box.innerHTML = `<div class="msg ok">Ανέβηκε: ${esc(f.name)} (${(f.size / 1024).toFixed(0)} KB → ${(blob.size / 1024).toFixed(0)} KB)</div>`;
    } catch (x) { if (box) box.innerHTML = `<div class="msg err">${esc(x.message || x)}</div>`; }
  }
  after?.(done);
  return done;
}
async function pickImage(path) {
  try { LIB = await API.images(); } catch (x) { toast(x.message); return; }
  const builtIn = [...new Set(DRAFT.regions.flatMap(r => [r.image, ...(r.experiences || []).map(x => x.image)]).filter(s => s && !/^(https:|blob:)/.test(s)))];
  const all = [...LIB.map(f => ({ src: f.url, name: f.name.split("/").pop() })), ...builtIn.map(s => ({ src: s, name: s.split("/").pop() }))];
  openDrawer("Επιλογή φωτογραφίας", `
    <label class="btn btn-primary">Ανέβασμα νέας φωτογραφίας<input type="file" id="pickUpload" accept="image/jpeg,image/png,image/webp" hidden></label>
    <div id="pickMsg"></div>
    <div class="lib">${all.map(f => `<button class="lib-item pick" type="button" data-choose="${esc(f.src)}"><div class="thumb" style="background-image:url('${esc(previewSrc(f.src))}')"></div><div class="meta"><b>${esc(f.name)}</b></div></button>`).join("")}</div>`, "", true);
  const choose = (src) => { setPath(path, src); closeDrawer(); drawContent(); toast("Η φωτογραφία άλλαξε. Πατήστε Αποθήκευση για να δημοσιευτεί."); };
  $("#drawerBody").onclick = (e) => { const b = e.target.closest("[data-choose]"); if (b) choose(b.dataset.choose); };
  $("#pickUpload").addEventListener("change", (e) => uploadFiles(e.target.files, (urls) => { if (urls[0]) choose(urls[0]); }));
}
async function tabHistory() {
  $("#cmTab").innerHTML = `<div class="card"><div id="verList">${loading()}</div></div>`;
  try {
    const vs = await API.versions();

        <span class="sub num">${fmtDateTime(v.created_at)}${v.note ? " · " + esc(v.note) : ""}</span></div>

      `<div class="ver"><div><b>Αρχικό περιεχόμενο</b><span class="sub">Όπως είναι γραμμένο στον κώδικα του site</span></div>

  } catch (x) { $("#verList").innerHTML = failed(x); }

// Επεξεργασία του draft
function getPath(p) { return p.split(".").reduce((o, k) => o?.[k], DRAFT); }
function setPath(p, v) {
  const ks = p.split("."); let o = DRAFT;
  ks.slice(0, -1).forEach((k, i) => { if (o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; });
  o[ks[ks.length - 1]] = v; markDirty();
}
function markDirty() { DRAFT_DIRTY = true; const b = $("#saveBar"); if (b) b.hidden = false; }
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-path]"); if (!el || !DRAFT) return;
  setPath(el.dataset.path, el.hasAttribute("data-lines") ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value);
});
document.addEventListener("change", (e) => { const el = e.target.closest("select[data-path]"); if (el && DRAFT) setPath(el.dataset.path, el.value); });
document.addEventListener("click", async (e) => {
  const t = e.target;
  const tab = t.closest("[data-cm-tab]"); if (tab) { CM_TAB = tab.dataset.cmTab; drawContent(); return; }
  const lg = t.closest("[data-cm-lang]"); if (lg) { CM_LANG = lg.dataset.cmLang; drawContent(); return; }
  const mv = t.closest("[data-move]"); if (mv) { const [k, i, d] = mv.dataset.move.split(":"); const a = getPath(k), j = +i + +d; [a[i], a[j]] = [a[j], a[i]]; markDirty(); drawContent(); return; }
  const rm = t.closest("[data-remove]");
  if (rm) {
    if (rm.dataset.confirm !== "1") { rm.dataset.confirm = "1"; rm.textContent = "Σίγουρα;"; setTimeout(() => { if (rm.isConnected) { rm.dataset.confirm = ""; rm.textContent = "Διαγραφή"; } }, 3000); return; }
    const [k, i] = rm.dataset.remove.split(":"); getPath(k).splice(+i, 1); markDirty(); drawContent(); return;
  }
  if (t.closest("[data-add-service]")) {
    const n = DRAFT.services.length + 1;
    DRAFT.services.push({ id: "service-" + Date.now().toString(36), icon: "sparkle", el: { title: "Νέα υπηρεσία " + n, short: "", body: "", points: [] }, en: { title: "New service " + n, short: "", body: "", points: [] } });
    markDirty(); drawContent(); return;
  }
  const ax = t.closest("[data-add-exp]");
  if (ax) { const r = DRAFT.regions[+ax.dataset.addExp]; (r.experiences ||= []).push({ id: "exp-" + Date.now().toString(36), image: "", el: { title: "Νέα εμπειρία", text: "" }, en: { title: "New experience", text: "" } }); markDirty(); drawContent(); return; }
  const pi = t.closest("[data-pick-image]"); if (pi) { pickImage(pi.dataset.pickImage); return; }
  const di = t.closest("[data-del-image]");
  if (di) {
    if (di.dataset.confirm !== "1") { di.dataset.confirm = "1"; di.textContent = "Σίγουρα;"; setTimeout(() => { if (di.isConnected) { di.dataset.confirm = ""; di.textContent = "Διαγραφή"; } }, 3000); return; }
    try { await API.removeImage(di.dataset.delImage); toast("Η φωτογραφία διαγράφηκε"); tabImages(); } catch (x) { toast("Δεν διαγράφηκε: " + x.message); }
    return;
  }
  if (t.closest("[data-cm-discard]")) {
    const b = t.closest("[data-cm-discard]");
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Σίγουρα;"; return; }
    DRAFT = clone(EFFECTIVE); DRAFT_DIRTY = false; drawContent(); toast("Οι αλλαγές απορρίφθηκαν"); return;
  }
  if (t.closest("[data-cm-preview]")) { openPreview(DRAFT, "Προεπισκόπηση αλλαγών"); return; }
  if (t.closest("[data-cm-save]")) { openSave(); return; }
  const vp = t.closest("[data-ver-preview]");
  if (vp) { const id = +vp.dataset.verPreview; try { openPreview(id ? effectiveContent(await API.version(id)) : effectiveContent({}), id ? `Έκδοση #${id}` : "Αρχικό περιεχόμενο"); } catch (x) { toast(x.message); } return; }
  const vr = t.closest("[data-ver-restore]");
  if (vr) {
    if (vr.dataset.confirm !== "1") { vr.dataset.confirm = "1"; vr.textContent = "Επιβεβαίωση επαναφοράς"; return; }
    const id = +vr.dataset.verRestore;
    try { const data = id ? await API.version(id) : {}; await doPublish(data, id ? `Επαναφορά έκδοσης #${id}` : "Επαναφορά αρχικού περιεχομένου"); } catch (x) { toast("Η επαναφορά απέτυχε: " + x.message); }
  }
});
function openPreview(content, title) {
  if (!SITE_URL) { toast("Δεν βρέθηκε το site για προεπισκόπηση."); return; }
  openDrawer(esc(title), `<p class="muted small" style="margin:0">Έτσι θα φαίνεται το site. Τίποτα δεν έχει αποθηκευτεί ακόμη.</p><iframe class="preview-frame" id="pvFrame" title="Προεπισκόπηση" src="${esc(SITE_URL)}?preview"></iframe>`,
    DRAFT_DIRTY && content === DRAFT ? `<button class="btn" type="button" data-close>Συνέχεια επεξεργασίας</button><button class="btn btn-primary" type="button" data-cm-save>Αποθήκευση</button>` : `<button class="btn" type="button" data-close>Κλείσιμο</button>`, true);
  const f = $("#pvFrame");
  f.addEventListener("load", () => { try { f.contentWindow.AK_applyContent(clone(content), CM_LANG); } catch {} }, { once: true });
}
function openSave() {
  openDrawer("Αποθήκευση αλλαγών", `<p style="margin:0">Οι αλλαγές θα εμφανιστούν αμέσως στο site. Η τωρινή έκδοση φυλάγεται στο «Ιστορικό εκδόσεων» για επαναφορά.</p>
    <label class="field"><span class="label">Σημείωση (προαιρετική)</span><input class="input" id="saveNote" maxlength="200" placeholder="π.χ. Νέα φωτογραφία Ζακύνθου"></label>`,
    `<button class="btn" type="button" data-close>Άκυρο</button><button class="btn" type="button" data-cm-preview>Προεπισκόπηση</button><button class="btn btn-primary" type="button" id="saveGo">Δημοσίευση</button>`);
  $("#saveGo").addEventListener("click", async () => { $("#saveGo").disabled = true; try { await doPublish(DRAFT, $("#saveNote").value.trim()); } catch (x) { toast("Δεν αποθηκεύτηκε: " + x.message); $("#saveGo").disabled = false; } });
}
async function doPublish(data, note) {
  await API.publish(clone(data), note);
  PUBLISHED = await API.content(); EFFECTIVE = effectiveContent(PUBLISHED?.data); DRAFT = clone(EFFECTIVE); DRAFT_DIRTY = false;
  closeDrawer(); toast("Δημοσιεύτηκε στο site"); drawContent();
}
addEventListener("beforeunload", (e) => { if (DRAFT_DIRTY) { e.preventDefault(); e.returnValue = ""; } });
