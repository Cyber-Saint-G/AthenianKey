  /* Zoom: η φωτογραφία «μεγαλώνει» από την κάρτα και κεντράρεται στη νέα σελίδα */
  // Ρυθμίσεις μετάβασης (ms): μεγαλύτερες τιμές = πιο αργή, πιο «βελούδινη» κίνηση
  const FLIP = { open: 1300, back: 1100, fade: 450, easing: "cubic-bezier(.16,1,.3,1)" };
  function flip(fromBox, toBox, fromRect, duration = FLIP.open) {
    const fromImg = fromBox?.querySelector("img"), toImg = toBox?.querySelector("img");
    if (!fromImg || !toImg || matchMedia("(prefers-reduced-motion: reduce)").matches || !toImg.animate) return;
    const a = fromRect || fromBox.getBoundingClientRect(), b = toBox.getBoundingClientRect();
    const ra = getComputedStyle(fromBox).borderTopLeftRadius, rb = getComputedStyle(toBox).borderTopLeftRadius;
    const pa = getComputedStyle(fromImg).objectPosition, pb = getComputedStyle(toImg).objectPosition;
    const c = fromImg.cloneNode(); c.removeAttribute("onerror"); c.className = "flip-clone"; c.removeAttribute("style");
    document.body.appendChild(c);
    toImg.style.transition = "none"; toImg.style.opacity = "0";
    const box = (r, rad, pos) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: rad, objectPosition: pos });
    const anim = c.animate([box(a, ra, pa), box(b, rb, pb)], { duration, easing: FLIP.easing, fill: "forwards" });
    const done = () => {
      // ο κλώνος σβήνει απαλά πάνω στη φωτογραφία προορισμού (χωρίς «πήδημα» ανάλυσης)
      toImg.style.opacity = "";
      const fade = c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FLIP.fade, easing: "ease-out", fill: "forwards" });
      fade.onfinish = fade.oncancel = () => { c.remove(); toImg.style.transition = ""; };
    };
    anim.onfinish = done; anim.oncancel = () => { toImg.style.opacity = ""; c.remove(); };
  }

  /* Άνοιγμα προορισμού: η κάρτα «σηκώνεται» από το σημείο όπου βρίσκεται και μεγαλώνει
     σε όλη την οθόνη, ενώ η αρχική από πίσω απομακρύνεται (βάθος), όπως το άνοιγμα εφαρμογής στο iPhone. */
  let opening = false;
  function openRegion(card) {
    const id = card.dataset.region, r = CONFIG.regions.find(x => x.id === id);
    const photo = card.querySelector(".photo"), im = photo?.querySelector("img");
    if (opening) return;
    if (!r || !im || !im.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { location.hash = id; return; }
    opening = true;
    const hi = r.background || r.image; if (hi) { const pre = new Image(); pre.src = hi; }      // προφόρτωση υψηλής ανάλυσης
    const a = photo.getBoundingClientRect();                                                    // η θέση της κάρτας ΤΩΡΑ
    const ra = getComputedStyle(photo).borderTopLeftRadius, pa = getComputedStyle(im).objectPosition;
    const pb = /^[\d.]+% [\d.]+%$/.test(r.backgroundPosition || "") ? r.backgroundPosition : "50% 50%";
    const H = Math.max(innerHeight * 1.18, innerHeight);
    const c = im.cloneNode(); c.removeAttribute("onerror"); c.className = "flip-clone"; c.removeAttribute("style");
    document.body.appendChild(c);
    card.style.visibility = "hidden";                                                           // η ίδια η κάρτα σηκώνεται
    const box = (x, y, w, h, rad, pos) => ({ left: x + "px", top: y + "px", width: w + "px", height: h + "px", borderRadius: rad, objectPosition: pos });
    const grow = c.animate([box(a.left, a.top, a.width, a.height, ra, pa), box(0, 0, innerWidth, H, "0px", pb)],
      { duration: FLIP.open, easing: FLIP.easing, fill: "forwards" });
    // βάθος: η αρχική μεγεθύνεται ελαφρά προς την κάρτα, θολώνει και σκουραίνει
    const app = document.querySelector(".app"), nav = document.querySelector(".nav-wrap");
    app.style.transformOrigin = `${a.left + a.width / 2}px ${a.top + a.height / 2 + scrollY}px`;
    const depth = [{ transform: "none", filter: "none", opacity: 1 }, { transform: "scale(1.08)", filter: "blur(8px)", opacity: .35 }];
    const opts = { duration: FLIP.open, easing: FLIP.easing, fill: "forwards" };
    const da = app.animate(depth, opts), dn = nav.animate([{ opacity: 1 }, { opacity: 0 }], { ...opts, duration: FLIP.open * .6 });
    const finish = () => {
      pendingFlip = { clone: c, cleanup: () => { da.cancel(); dn.cancel(); app.style.transformOrigin = ""; card.style.visibility = ""; opening = false; } };
      location.hash = id;
    };
    grow.onfinish = finish;
    grow.oncancel = () => { c.remove(); da.cancel(); dn.cancel(); card.style.visibility = ""; opening = false; };
  }
  function revealRegion(clone, bg) {
    const f = pendingFlipCleanup; pendingFlipCleanup = null; f?.();
    const sharp = bg.querySelector("img.sharp");
    bg.classList.add("settling");
    const fadeOut = () => {
      const fa = clone.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FLIP.fade + 250, easing: "ease-out", fill: "forwards" });
      fa.onfinish = fa.oncancel = () => clone.remove();
      setTimeout(() => bg.classList.remove("settling"), 120);                 // το θόλωμα απλώνεται καθώς σβήνει ο κλώνος
    };
    if (!sharp) return fadeOut();
    let done = false; const go = () => { if (!done) { done = true; fadeOut(); } };
    (sharp.decode ? sharp.decode() : Promise.resolve()).then(go, go);         // περιμένουμε να φορτώσει η καθαρή φωτογραφία
    setTimeout(go, 1500);
  }
  let pendingFlipCleanup = null;

  /* ── Περιεχόμενο από το CMS (εφαρμόζεται πάνω στο CONFIG) ── */
  const strings = (o) => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => typeof v === "string"));
  function applyContent(d) {
    if (!d || typeof d !== "object") return;
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    CONFIG.brand = typeof d.brand === "string" && d.brand.trim() ? d.brand : base.brand;
    Object.assign(CONFIG.contact, base.contact, strings(d.contact));
    Object.keys(CONFIG.text).forEach(l => Object.assign(CONFIG.text[l], base.text[l], strings(d.text?.[l])));
    CONFIG.services = Array.isArray(d.services) && d.services.length ? d.services : base.services;
    CONFIG.regions = Array.isArray(d.regions) && d.regions.length ? d.regions : base.regions;
    CONFIG.photoCredits = Array.isArray(d.photoCredits) ? d.photoCredits : base.photoCredits;

      .catch(() => {})

    const device = /iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobi/i.test(ua)) ? "tablet"

  /* ── Routing (#home, #services, #request, #contact) ─────── */
  const VIEWS = ["home", "services", "request", "contact"];
  function route(silent) {
    const h = location.hash.slice(1);
    const isRegion = CONFIG.regions.some(r => r.id === h);
    const v = isRegion ? "region" : VIEWS.includes(h) ? h : "home";
    currentRegion = isRegion ? h : null;
    if (isRegion) renderRegion(h);
    document.querySelectorAll(".view").forEach(el => el.classList.toggle("is-active", el.dataset.view === v));
    const navV = isRegion ? "home" : v;
    document.querySelectorAll("#nav a").forEach(a => {
      const on = a.getAttribute("href") === "#" + navV;
      if (on && !a.hasAttribute("aria-current")) { a.classList.remove("pop"); void a.offsetWidth; a.classList.add("pop"); }
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");

    sh.addEventListener("touchstart", e => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = "none"; } }, { passive: true });
    sh.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translate(-50%, ${dy}px)`; }, { passive: true });
    sh.addEventListener("touchend", () => { if (y0 === null) return; sh.style.transition = ""; y0 = null; if (dy > 90) closeSheet(); else sh.style.transform = ""; });
  })();

  /* ── Toast & copy ───────────────────────────────────────── */
  let toastTimer;
  function toast(text) {
    const t = $("#toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function copy(text) {
    const done = () => toast(T("copied"));
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch {} ta.remove();
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
  }

  /* ── Form ───────────────────────────────────────────────── */
  const val = (id) => $(id).value.trim();
  function buildMessage() {
    const ss = CONFIG.services.filter(x => state.services.includes(x.id));
    const r = CONFIG.regions.find(x => x.id === state.region);
    const lines = [
      T("msgHeader"), `${T("refLabel")}: ${state.ref}`, "",
      `${T("fService")}: ${ss.length ? ss.map(x => x[lang].title).join(", ") : "–"}`,
      `${T("fRegion")}: ${r ? r[lang] : "–"}`,
      `${T("fDate")}: ${val("#fDate") || "–"}`,
      `${T("fGuests")}: ${state.guests}`,
      `${T("fName")}: ${val("#fName") || "–"}`,
      `${T("fPhone")}: ${val("#fPhone") || "–"}`,
    ];
    if (val("#fEmail")) lines.push(`Email: ${val("#fEmail")}`);
    if (val("#fNotes")) lines.push("", val("#fNotes"));
    return lines.join("\n");
  }
  function updateSendLinks() {
    const msg = buildMessage();
    $("#sendWa").href = waHref(msg);
    $("#sendMail").href = `mailto:${C.email}?subject=${encodeURIComponent(T("msgEmailSubject") + " – " + (val("#fName") || CONFIG.brand))}&body=${encodeURIComponent(msg)}`;
  }
  function validate() {
    const err = $("#formError");
    ["#fName", "#fPhone"].forEach(id => $(id).removeAttribute("aria-invalid"));
    let m = "";
    if (!state.services.length) m = T("errService");
    else if (!val("#fName")) { m = T("errName"); $("#fName").setAttribute("aria-invalid", "true"); $("#fName").focus(); }
    else if (!val("#fPhone")) { m = T("errPhone"); $("#fPhone").setAttribute("aria-invalid", "true"); $("#fPhone").focus(); }
    err.textContent = m;
    if (m && !state.services.length) $("#serviceChips").scrollIntoView({ behavior: "smooth", block: "center" });
    return !m;
  }
  function onSend(e) {
    updateSendLinks();
    if (!validate()) { e.preventDefault(); return; }
    const msg = buildMessage();
    if (!PREVIEW) rpc("submit_request", { p: {
      ref: state.ref, services: state.services, region: state.region, date: val("#fDate") || null,
      guests: state.guests, name: val("#fName"), phone: val("#fPhone"), email: val("#fEmail"),
      notes: val("#fNotes"), lang, channel: e.currentTarget.id === "sendWa" ? "whatsapp" : "email",
    } });
    state.sent = true;
    setTimeout(() => sentSheet(msg), 400);
  }
  function setRegion(id) {
    state.region = id;
    const inp = document.querySelector(`#regionChips input[value="${id}"]`); if (inp) inp.checked = true;
    updateSendLinks();
  }
  function setGuests(n) { state.guests = Math.min(99, Math.max(1, n)); $("#fGuests").textContent = state.guests; updateSendLinks(); }

  /* ── Events ─────────────────────────────────────────────── */
  document.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]"); if (o) return serviceSheet(o.dataset.open);
    const c = e.target.closest("[data-copy]"); if (c) { e.preventDefault(); return copy(c.dataset.copy); }
    if (e.target.closest("[data-close]")) return closeSheet();
    const rg = e.target.closest("[data-region]");
    if (rg) { openRegion(rg); return; }
    if (e.target.closest("[data-back]")) { const bg = $("#regionPhoto"); pendingFlip = { from: bg, rect: bg.querySelector("img")?.getBoundingClientRect(), back: currentRegion }; location.hash = "home"; return; }
    const ex = e.target.closest("[data-exp]"); if (ex) return expSheet(ex.dataset.exp);
    const pl = e.target.closest("[data-plan]"); if (pl) { setRegion(pl.dataset.plan); return; }
    const er = e.target.closest("[data-exp-request]");
    if (er) {
      const [rid, xid] = er.dataset.expRequest.split(":");
      const x = CONFIG.regions.find(q => q.id === rid).experiences.find(q => q.id === xid);
      if (!state.services.includes("experiences")) state.services.push("experiences");
      const inp = document.querySelector('#serviceChips input[value="experiences"]'); if (inp) inp.checked = true;
      setRegion(rid);
      const notes = $("#fNotes"), line = `${T("expLabel")}: ${x[lang].title}`;
      if (!notes.value.includes(line)) notes.value = (notes.value ? notes.value + "\n" : "") + line;
      closeSheet(); $("#formError").textContent = ""; updateSendLinks(); location.hash = "request"; return;
    }
    const r = e.target.closest("[data-request]");
    if (r) {
      if (!state.services.includes(r.dataset.request)) state.services.push(r.dataset.request); closeSheet();
      const inp = document.querySelector(`#serviceChips input[value="${r.dataset.request}"]`); if (inp) inp.checked = true;
      $("#formError").textContent = ""; updateSendLinks();
      location.hash = "request";
    }
  });
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("#langBtn").addEventListener("click", () => { lang = lang === "el" ? "en" : "el"; store.set("ak-lang-v2", lang); render(); });

  $("#form").addEventListener("change", (e) => {
    if (e.target.name === "service") { state.services = [...document.querySelectorAll("#serviceChips input:checked")].map(i => i.value); $("#formError").textContent = ""; }
    if (e.target.name === "region") state.region = e.target.value;
    updateSendLinks();
  });
  $("#form").addEventListener("input", updateSendLinks);
  const freshRef = () => { if (state.sent) { state.sent = false; state.ref = newRef(); } };
  $("#form").addEventListener("input", freshRef, true);
  $("#form").addEventListener("change", freshRef, true);
  $("#form").addEventListener("submit", e => e.preventDefault());
  $("#gMinus").addEventListener("click", () => setGuests(state.guests - 1));
  $("#gPlus").addEventListener("click", () => setGuests(state.guests + 1));
  $("#sendWa").addEventListener("click", onSend);
  $("#sendMail").addEventListener("click", onSend);
  $("#fDate").min = new Date().toISOString().slice(0, 10);

  window.addEventListener("hashchange", () => { closeSheet(); route(); });

  $("#privacyNote").hidden = !backendOn;

  /* ── Σελίδα εισόδου: διακόπτης, ήχος, μετάβαση ──────────── */
  /* Καμπανάκι αναγγελιών αεροδρομίου: 3 νότες (Σολ-Σι-Ρε) με αντήχηση αίθουσας.
     Φτιάχνεται μία φορά ως αρχείο WAV και παίζει από στοιχείο <audio>, που
     δουλεύει και στο iPhone (και με τον διακόπτη σίγασης). */
  function chimeWav() {
    const sr = 16000, n = Math.floor(sr * 4.4), d = new Float32Array(n);
    [[392.0, 0], [493.88, .42], [587.33, .84]].forEach(([f, dt], k) => {
      const s0 = Math.floor(dt * sr), dur = k === 2 ? 3.2 : 2.2;
      [[1, 1], [2, .32], [3, .1], [4.2, .05]].forEach(([m, a]) => {
        const w = 2 * Math.PI * f * m / sr, tau = dur / m ** .4 / 9.2 * sr;
        for (let i = 0; s0 + i < n; i++) {
          const env = i < 190 ? i / 190 : Math.exp(-(i - 190) / tau);
          if (env < 2e-4 && i > 190) break;
          d[s0 + i] += a * env * Math.sin(w * i);
        }
      });
    });
    const out = new Float32Array(n);                         // αντήχηση: 4 παράλληλα comb filters
    [1557, 1617, 1491, 1422].map(x => Math.round(x * sr / 44100 * 1.6)).forEach(L => {
      const buf = new Float32Array(L); let j = 0;
      for (let i = 0; i < n; i++) { const y = buf[j]; buf[j] = d[i] + y * .8; out[i] += y * .07; j = (j + 1) % L; }
    });
    let peak = 0; for (let i = 0; i < n; i++) { out[i] += d[i]; peak = Math.max(peak, Math.abs(out[i])); }
    const bytes = new Uint8Array(44 + n * 2), v = new DataView(bytes.buffer);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round(out[i] / peak * .85 * 32767), true);
    return bytes;
  }
  let chimeBytes = null, chimeAudio = null, chimeOn = false, wantChime = false, wa = null, waBuf = null, waStarted = false, waTimer = null;
  // Ο ήχος φορτώνεται από αρχείο MP3 (CONFIG.introSound). Αν λείπει, φτιάχνεται επί τόπου ως WAV.
  function useGeneratedChime() {
    try { chimeBytes = chimeWav(); chimeAudio.src = URL.createObjectURL(new Blob([chimeBytes], { type: "audio/wav" })); chimeAudio.load(); } catch {}
  }
  function prepareChime() {
    if (chimeAudio) return;
    try {
      chimeAudio = new Audio(); chimeAudio.preload = "auto"; chimeAudio.setAttribute("playsinline", "");
      const src = CONFIG.introSound;
      if (!src) { useGeneratedChime(); return; }
      chimeAudio.addEventListener("error", useGeneratedChime, { once: true });
      chimeAudio.src = src; chimeAudio.load();
      fetch(src).then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => { if (!chimeBytes) chimeBytes = new Uint8Array(b); }).catch(() => {});
    } catch {}
  }
  // Ξεκλειδώνει τον ήχο σε κάθε άγγιγμα (χωρίς να ακούγεται), ώστε να μπορεί να παίξει αμέσως μετά
  function unlockSound(prime) {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
    prepareChime();
    try {
      wa = wa || new (window.AudioContext || window.webkitAudioContext)();
      if (wa.state !== "running") wa.resume?.();
      const s = wa.createBufferSource(); s.buffer = wa.createBuffer(1, 1, 22050); s.connect(wa.destination); s.start(0);   // σιωπηλό «ξεκλείδωμα» iOS
    } catch {}
    if (wa && !waBuf && chimeBytes) { try { const r = wa.decodeAudioData(chimeBytes.buffer.slice(0), b => { waBuf = b; }, () => {}); r?.catch?.(() => {}); } catch {} }
    if (prime && chimeAudio && !chimeOn && chimeAudio.paused && !chimeAudio.dataset.primed) {
      try { chimeAudio.muted = true; const p = chimeAudio.play();
        p?.then(() => {
          chimeAudio.dataset.primed = "1";
          if (wantChime) return;                                   // ο κανονικός ήχος έχει ήδη ζητηθεί: δεν τον σταματάμε
          chimeAudio.pause(); try { chimeAudio.currentTime = 0; } catch {} chimeAudio.muted = false;
        }, () => { if (!wantChime) chimeAudio.muted = false; }); } catch {}
    }
  }
  function playWebAudio() {
    if (chimeOn || waStarted || !wa || !waBuf || wa.state !== "running") return false;
    try { const s = wa.createBufferSource(); s.buffer = waBuf; s.connect(wa.destination); s.start(); waStarted = chimeOn = true; return true; } catch { return false; }
  }
  // Παίζει το καμπανάκι μία φορά. Μπορεί να κληθεί από πολλά γεγονότα (σήκωμα δαχτύλου, touchend, click):
  // αν μια προσπάθεια μπλοκαριστεί, η επόμενη ξαναδοκιμάζει.
  function chime() {
    if (chimeOn) return;
    wantChime = true;
    if (chimeAudio && !chimeAudio.paused && !chimeAudio.muted) { chimeOn = true; return; }   // ήδη παίζει
    unlockSound();
    try { chimeAudio.muted = false; } catch {}
    try { if (chimeAudio.readyState > 0) chimeAudio.currentTime = 0; } catch {}   // στο iPhone μπορεί να μην έχει φορτώσει ακόμη
    try {
      const p = chimeAudio.play();
      p?.then(() => { if (waStarted) chimeAudio.pause(); else chimeOn = true; }, () => {});
    } catch {}
    clearTimeout(waTimer);
    waTimer = setTimeout(() => {             // αν το <audio> δεν ξεκίνησε, παίζει μέσω Web Audio
      if (chimeOn || (chimeAudio && !chimeAudio.paused && !chimeAudio.muted)) { chimeOn = true; return; }
      playWebAudio();
    }, 400);
  }
  function initSplash() {
    if (PREVIEW) return;
    const splash = $("#splash"), sw = $("#switch"), knob = $("#switchKnob"), fill = $("#switchFill"), icon = knob.querySelector("svg"), cue = sw.querySelector(".switch-cue");
    document.documentElement.classList.add("ak-splash"); splash.hidden = false;
    sw.setAttribute("aria-label", T("splashAria"));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let travel = 0, start = null, base = 0, off = 0, moved = 0, done = false;
    const measure = () => { travel = sw.clientHeight - knob.offsetHeight - 2 * parseFloat(getComputedStyle(knob).bottom); };
    const paint = () => {
      const p = travel ? off / travel : 0;
      knob.style.transform = `translateY(${-off}px)`;
      fill.style.height = `${knob.offsetHeight + off}px`; fill.style.opacity = .18 + .82 * p;
      icon.style.transform = `rotate(${-90 * p}deg)`; cue.style.opacity = 1 - p * 1.6;
    };
    const finish = (withSound) => {
      if (done) return; done = true;
      sw.classList.add("springing", "on"); sw.setAttribute("aria-checked", "true");
      off = travel; paint(); if (withSound) chime(); navigator.vibrate?.(18);
      setTimeout(enter, reduce ? 150 : 650);
    };
    const enter = () => {
      const r = knob.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 40;
      const app = document.querySelector(".app"), nav = document.querySelector(".nav-wrap");
      const ease = "cubic-bezier(.7,0,.2,1)";
      document.documentElement.classList.remove("ak-splash");
      if (reduce || !splash.animate) { splash.remove(); return; }
      [app, nav].forEach(el => el.animate(
        [{ clipPath: `circle(0px at ${x}px ${y - (el === app ? 0 : el.getBoundingClientRect().top)}px)`, transform: "scale(1.04)" },
         { clipPath: `circle(${R}px at ${x}px ${y - (el === app ? 0 : el.getBoundingClientRect().top)}px)`, transform: "none" }],
        { duration: 1050, easing: ease }));
      $("#splashInner").animate([{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "scale(1.12)", filter: "blur(12px)" }],
        { duration: 700, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
      setTimeout(() => splash.remove(), 1060);
    };
    sw.addEventListener("touchstart", () => { if (!done) unlockSound(true); }, { passive: true });
    splash.addEventListener("touchend", () => { if (!done) unlockSound(true); }, { passive: true });   // άγγιγμα οπουδήποτε στη σελίδα
    sw.addEventListener("pointerdown", (e) => {
      if (done) return; unlockSound(true); measure();
      sw.classList.remove("springing"); sw.setPointerCapture(e.pointerId);
      start = e.clientY; base = off; moved = 0;
    });
    sw.addEventListener("pointermove", (e) => {
      if (start === null || done) return;
      moved = Math.max(moved, Math.abs(start - e.clientY));
      off = Math.min(travel, Math.max(0, base + (start - e.clientY))); paint();
      if (off >= travel) finish(false);                          // ο ήχος παίζει μόλις σηκωθεί το δάχτυλο
    });
    const release = () => {
      if (start === null) return; start = null;
      if (done) { chime(); return; }
      if (moved < 6 || off > travel * .55) finish(true);        // πάτημα ή αρκετό σύρσιμο: ενεργοποίηση
      else { sw.classList.add("springing"); off = 0; paint(); }  // αλλιώς επιστρέφει κάτω με ελατήριο
    };
    sw.addEventListener("pointerup", release);
    sw.addEventListener("pointercancel", release);
    sw.addEventListener("touchend", () => { if (done) chime(); else unlockSound(true); });   // στο iPhone ο ήχος επιτρέπεται στο touchend
    sw.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); measure(); finish(true); } });
    sw.addEventListener("click", (e) => { e.preventDefault(); if (done) chime(); });
    requestAnimationFrame(() => { measure(); paint(); });
    setTimeout(prepareChime, 300);
  }
  render();
  route();
  loadContent();
  initSplash();
})();
</script>
